<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <img class="header__logo" src="https://thumb.wikimedia.org/wikipedia/commons/thumb/2/24/LEGO_logo.svg/3840px-LEGO_logo.svg.png?utm_source=ru.wikipedia.org&utm_campaign=index&utm_content=thumbnail" alt="lego">
        <div class="header__links">
            <a href="">Вакансии</a>
            <a href="">Работодатели</a>
        </div>
        <button class="top-button">Опубликовать</button>
    </header>
    
    <section class="about">
        <h1>Больше вакансий <br> в telegram-канале</h1>
        <button class="about__btn">Перейти в ТГ канал</button>
    </section>

    <section class="info">
        <div class="info__form">
            <input type="text" placeholder="Поиск" name="search">
            <form>
                <div class="form__group">
                    <label>Формат</label>
                    <button type="button" class="form__format">Парт-тайм</button>
                    <button type="button" class="form__format">Фулл-тайм</button>
                    <button type="button" class="form__format">Стажировка</button>
                </div>
                <div class="form__group">
                    <label>Формат</label>
                    <button type="button" class="form__format">Офис</button>
                    <button type="button" class="form__format">Удаленно</button>
                    <button type="button" class="form__format">Гибрид</button>
                </div>
                <div class="form__group">
                    <label>Грейд</label>
                    <button type="button" class="form__format">Junior</button>
                    <button type="button" class="form__format">Middle</button>
                    <button type="button" class="form__format">Senior</button>
                    <button type="button" class="form__format">Lead</button>
                    <button type="button" class="form__format">Head</button>
                </div>
                <div class="form__group">
                    <label>Локация</label>
                    Москва<input type="checkbox" value="msc">
                    Санкт-Петербург<input type="checkbox" value="spb">
                    Казань<input type="checkbox" value="msc">
                    Нижний Новгород<input type="checkbox" value="spb">
                </div>

                <div class="form__group">
                    <label>Зарплата</label>
                    <input type="number" placeholder="Минимум">
                    <input type="number" placeholder="Максимум">
                </div>
            </form>
        </div>

        <div class="info__cards">

        </div>
    </section>


</body>
</html>
